<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f3742"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4d6fd6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2e9d63"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d9852b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2f3742" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="risk" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2655c7"/>
      <stop offset="35%" stop-color="#18a999"/>
      <stop offset="65%" stop-color="#f2c94c"/>
      <stop offset="100%" stop-color="#df3f3f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="950" fill="#fbfbf8"/>

  <text x="800" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2933">
    Multi-granularity Mixed Supervision for a Shared Lesion Risk Map
  </text>
  <text x="800" y="93" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5d6673">
    Voxel-level RA, target-ROI-level TBx, and region-level SBx supervise one 3D lesion prediction model
  </text>

  <!-- Input block -->
  <rect x="60" y="190" width="250" height="410" rx="22" fill="#ffffff" stroke="#d7dde5" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1f2933">
    mpMRI Input
  </text>
  <text x="185" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6673">
    X in R^{B x 3 x D x H x W}
  </text>
  <rect x="95" y="295" width="150" height="92" rx="10" fill="#f2f4f7" stroke="#c7ced8"/>
  <rect x="110" y="315" width="150" height="92" rx="10" fill="#e7eaf0" stroke="#c7ced8"/>
  <rect x="125" y="335" width="150" height="92" rx="10" fill="#dbe1ea" stroke="#c7ced8"/>
  <text x="200" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#303947">T2</text>
  <circle cx="150" cy="315" r="18" fill="#9aa4b2" opacity="0.55"/>
  <circle cx="180" cy="360" r="26" fill="#ffffff" opacity="0.85"/>
  <circle cx="215" cy="385" r="18" fill="#7b8794" opacity="0.45"/>
  <text x="185" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#303947">T2 / DWI / ADC</text>
  <text x="185" y="501" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7280">Resampling</text>
  <text x="185" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7280">Prostate-centred crop</text>
  <text x="185" y="551" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7280">Gland foreground normalisation</text>

  <!-- Network block -->
  <rect x="390" y="190" width="290" height="410" rx="22" fill="#ffffff" stroke="#d7dde5" stroke-width="2" filter="url(#shadow)"/>
  <text x="535" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1f2933">
    3D Residual U-Net
  </text>
  <text x="535" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6673">
    Single lesion output head
  </text>
  <g transform="translate(430 305)">
    <rect x="0" y="80" width="38" height="70" rx="6" fill="#d8e8ff" stroke="#8eb3e8"/>
    <rect x="58" y="115" width="38" height="70" rx="6" fill="#d8e8ff" stroke="#8eb3e8"/>
    <rect x="116" y="150" width="38" height="70" rx="6" fill="#d8e8ff" stroke="#8eb3e8"/>
    <rect x="174" y="185" width="38" height="70" rx="6" fill="#d8e8ff" stroke="#8eb3e8"/>
    <rect x="232" y="150" width="38" height="70" rx="6" fill="#e5dcff" stroke="#b5a4ee"/>
    <rect x="174" y="115" width="38" height="70" rx="6" fill="#e5dcff" stroke="#b5a4ee"/>
    <rect x="116" y="80" width="38" height="70" rx="6" fill="#e5dcff" stroke="#b5a4ee"/>
    <rect x="58" y="45" width="38" height="70" rx="6" fill="#e5dcff" stroke="#b5a4ee"/>
    <path d="M38,112 L58,147" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M96,147 L116,182" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M154,182 L174,217" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M212,217 L232,182" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M174,147 L154,112" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M116,112 L96,77" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M38,112 C96,95 155,95 212,147" stroke="#89a9d6" stroke-dasharray="8 6" stroke-width="2" fill="none"/>
    <path d="M96,147 C145,132 190,132 232,182" stroke="#89a9d6" stroke-dasharray="8 6" stroke-width="2" fill="none"/>
  </g>

  <!-- Main forward arrows -->
  <path d="M310,395 L390,395" stroke="#2f3742" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M680,395 L765,395" stroke="#2f3742" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- Risk map block -->
  <rect x="765" y="190" width="340" height="410" rx="22" fill="#ffffff" stroke="#d7dde5" stroke-width="2" filter="url(#shadow)"/>
  <text x="935" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1f2933">
    Shared Lesion Risk Map
  </text>
  <text x="935" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6673">
    L in R^{B x 1 x D x H x W}, P = sigmoid(L)
  </text>
  <rect x="830" y="305" width="210" height="155" rx="12" fill="#eef2f6" stroke="#c7ced8"/>
  <ellipse cx="935" cy="383" rx="82" ry="54" fill="#ffffff"/>
  <path d="M875,410 C900,340 978,315 1005,390 C970,445 910,458 875,410 Z" fill="url(#risk)" opacity="0.92"/>
  <path d="M835,423 C862,392 890,395 914,420" stroke="#2f5ad1" stroke-width="5" fill="none" opacity="0.8"/>
  <text x="935" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5d6673">
    One prediction map, three supervision paths
  </text>

  <!-- Supervision panel -->
  <rect x="1215" y="145" width="325" height="620" rx="24" fill="#f7fbf8" stroke="#91a99a" stroke-width="3" stroke-dasharray="9 8" filter="url(#shadow)"/>
  <text x="1378" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1f2933">
    Multi-granularity
  </text>
  <text x="1378" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1f2933">
    supervision
  </text>

  <!-- RA branch in panel -->
  <rect x="1250" y="255" width="255" height="120" rx="18" fill="#eef4ff" stroke="#4d6fd6" stroke-width="2"/>
  <text x="1378" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#294899">Voxel-level RA</text>
  <ellipse cx="1355" cy="325" rx="62" ry="33" fill="#ffffff"/>
  <ellipse cx="1394" cy="325" rx="25" ry="32" fill="#8b5cf6" opacity="0.82"/>
  <text x="1378" y="363" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">Y_RA: dense lesion mask</text>

  <!-- TBx branch in panel -->
  <rect x="1250" y="410" width="255" height="120" rx="18" fill="#edf9f1" stroke="#2e9d63" stroke-width="2"/>
  <text x="1378" y="437" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1e7145">Target-ROI-level TBx</text>
  <ellipse cx="1368" cy="480" rx="65" ry="34" fill="#ffffff"/>
  <ellipse cx="1337" cy="482" rx="26" ry="17" transform="rotate(35 1337 482)" fill="#97c77d"/>
  <ellipse cx="1410" cy="475" rx="23" ry="32" fill="#8b5cf6" opacity="0.82"/>
  <text x="1378" y="518" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">Y_TBx: sampled target ROI</text>

  <!-- SBx branch in panel -->
  <rect x="1250" y="565" width="255" height="150" rx="18" fill="#fff6ea" stroke="#d9852b" stroke-width="2"/>
  <text x="1378" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#9b5c12">Region-level SBx</text>
  <ellipse cx="1378" cy="646" rx="74" ry="42" fill="#ffffff"/>
  <line x1="1320" y1="646" x2="1436" y2="646" stroke="#646b73" stroke-width="2"/>
  <line x1="1349" y1="607" x2="1349" y2="684" stroke="#646b73" stroke-width="2"/>
  <line x1="1378" y1="604" x2="1378" y2="688" stroke="#646b73" stroke-width="2"/>
  <line x1="1407" y1="607" x2="1407" y2="684" stroke="#646b73" stroke-width="2"/>
  <path d="M1407,607 A74,42 0 0 1 1452,646 A74,42 0 0 1 1407,684 Z" fill="#a855f7" opacity="0.78"/>
  <text x="1378" y="704" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#425466">Z: zone mask, Y_SBx: region labels</text>

  <!-- Branch arrows and labels -->
  <path d="M1105,337 C1160,320 1185,314 1250,314" stroke="#4d6fd6" stroke-width="4" stroke-dasharray="10 7" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="1165" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4d6fd6">BCE + Dice</text>

  <path d="M1105,420 C1160,443 1185,464 1250,470" stroke="#2e9d63" stroke-width="4" stroke-dasharray="10 7" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="1167" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#2e9d63">ROI BCE</text>

  <path d="M1040,530 C1115,615 1175,638 1250,642" stroke="#d9852b" stroke-width="4" stroke-dasharray="10 7" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="1134" y="626" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#d9852b">Zone MIL loss</text>

  <!-- Derived operation boxes -->
  <rect x="805" y="642" width="260" height="92" rx="16" fill="#fff6ea" stroke="#d9852b" stroke-width="2"/>
  <text x="935" y="674" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#9b5c12">Zone MIL pooling</text>
  <text x="935" y="701" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5d6673">s_k = Pool(L over zone k)</text>
  <text x="935" y="724" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5d6673">p_k = sigmoid(s_k)</text>
  <path d="M935,600 L935,642" stroke="#d9852b" stroke-width="4" fill="none" marker-end="url(#arrowOrange)"/>

  <rect x="805" y="78" width="260" height="86" rx="16" fill="#edf9f1" stroke="#2e9d63" stroke-width="2"/>
  <text x="935" y="109" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1e7145">TBx ROI sampling</text>
  <text x="935" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5d6673">loss only inside sampled target ROIs</text>
  <path d="M935,190 L935,164" stroke="#2e9d63" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- Legend -->
  <rect x="60" y="790" width="1480" height="88" rx="18" fill="#ffffff" stroke="#d7dde5"/>
  <text x="95" y="824" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2933">Key message:</text>
  <text x="215" y="824" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#303947">
    the model predicts one shared lesion risk map; RA, TBx, and SBx supervise it at voxel, target-ROI, and region levels.
  </text>
  <line x1="95" y1="852" x2="150" y2="852" stroke="#2f3742" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="165" y="858" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5d6673">forward prediction</text>
  <line x1="330" y1="852" x2="385" y2="852" stroke="#4d6fd6" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#arrowBlue)"/>
  <text x="400" y="858" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5d6673">supervision / loss path</text>
</svg>
